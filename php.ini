; ==============================================================================
; Mitigasi Celah Keamanan PHP 14 Tahun (PHP2Shell: CVE-2026-109618 / CVE-2026-109619)
; ==============================================================================
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1

; ==============================================================================
; Resource Limits
; ==============================================================================
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
