worker_processes auto;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log /dev/stdout;

    # =========================================================================
    # 1. STANDARDIZED MIME TYPES (SELF-CONTAINED - NO EXTERNAL INCLUDES)
    # =========================================================================
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;

        text/plain                            txt;
        text/x-component                      htc;

        image/png                             png;
        image/tiff                            tif tiff;
        image/vnd.wap.wbmp                    wbmp;
        image/x-icon                          ico;
        image/x-jng                           jng;
        image/x-ms-bmp                        bmp;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        image/avif                            avif;

        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/otf                              otf;

        application/json                      json;
        application/pdf                       pdf;
        application/rtf                       rtf;
        application/zip                       zip;
        application/x-7z-compressed           7z;
        application/x-rar-compressed          rar;

        application/octet-stream              bin exe dll deb dmg iso img msi msp msm;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document   docx;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet         xlsx;
        application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;

        audio/midi                            mid midi kar;
        audio/mpeg                            mp3;
        audio/ogg                             ogg;
        audio/x-m4a                           m4a;

        video/3gpp                            3gpp 3gp;
        video/mp4                             mp4;
        video/mpeg                            mpeg mpg;
        video/quicktime                       mov;
        video/webm                            webm;
        video/x-msvideo                       avi;
    }

    default_type application/octet-stream;

    # =========================================================================
    # 2. PERFORMANCE & CONNECTION TUNING
    # =========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 128M;
    client_body_buffer_size 128k;

    # =========================================================================
    # 3. GZIP COMPRESSION
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # =========================================================================
    # 4. VIRTUAL SERVER CONFIGURATION
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /app/public;

        index index.php index.html index.htm;
        charset utf-8;

        # Security Headers (A+ Standard)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Main Route
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Laravel Storage (Direct Disk Mapping for Maximum Throughput)
        location ^~ /storage/ {
            alias /app/storage/app/public/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Vite Production Built Assets (Cache-Busted Immutable)
        location /build/ {
            access_log off;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Static Fonts
        location /fonts/ {
            access_log off;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Standard SEO & Utility Endpoints
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        # FastCGI PHP-FPM Engine (Tuned for Livewire 4 & Filament v4)
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;

            # FastCGI Buffer Tuning for Long Responses & Livewire Streaming
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_temp_file_write_size 64k;
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;

            # Self-Contained FastCGI Parameters
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_hide_header X-Powered-By;
        }

        # Security: Deny Access to Hidden Files (.env, .git, etc.)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
